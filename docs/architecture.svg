<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Infra AI platform architecture</title>
<desc>GitHub repo feeds GitHub Actions CI/CD, which builds and pushes an image to GHCR. That image deploys into an AWS VPC containing a public subnet, which contains a single EC2 t3.medium instance running a k3s cluster. Inside the cluster run two workloads: the inference-api pods and a Prometheus plus Grafana monitoring stack. The cluster is reachable from a browser over its public IP on a NodePort.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="560" fill="#FFFFFF"/>

<g>
